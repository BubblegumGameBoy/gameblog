  変更点はこのファイル末尾の「あなたへのおすすめ」スクリプトのみ。
  ・重い取得処理を初期表示後（アイドル時）に実行 → 表示の足を引っ張らない
  ・取得結果をセッション内キャッシュ → 記事を回遊しても再取得しない

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (document.body.classList.contains('page-index') || document.body.classList.contains('page-archive')) {

        var articles = document.querySelectorAll('.archive-entry');
        var insertPositions;
        if (articles.length <= 10) {
            insertPositions = [3, 8];
        } else {
            insertPositions = [3, 10, 20];
        }

        var adTemplate = `
            <div class="adsense-in-feed" style="margin: 35px 0; text-align: center; border-top: 1px dotted #ccc; border-bottom: 1px dotted #ccc; padding: 25px 0;">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-format="fluid"
                     data-ad-layout-key="-fn+1i-5s-la+1o6"
                     data-ad-client="ca-pub-2203567155161909"
                     data-ad-slot="7474576938"></ins>
            </div>
        `;
        var reversedPositions = insertPositions.slice().sort(function(a, b) { return b - a; });
        reversedPositions.forEach(function(pos) {
            if (articles.length >= pos) {
                articles[pos - 1].insertAdjacentHTML('afterend', adTemplate);
                (adsbygoogle = window.adsbygoogle || []).push({});
            }
        });
    }
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var openBtn = document.getElementById('bottom-tabbar-menu-btn');
  var closeBtn = document.getElementById('bottom-menu-close-btn');
  var overlay = document.getElementById('bottom-menu-overlay');

  if (openBtn) {
    openBtn.addEventListener('click', function(e) {
      e.preventDefault();
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  }
  if (closeBtn) {
    closeBtn.addEventListener('click', function() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    });
  }
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      }
    });
  }
});
</script>

<!-- ▼ あなたへのおすすめ（og:image版・CWV軽量化：アイドル実行＋セッションキャッシュ）
     出力HTMLは従来と同一。重い取得を初期表示後に回し、取得結果を使い回すだけ。 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (!document.body.classList.contains('page-entry')) return;

  var categoryLinks = document.querySelectorAll('.entry-categories a, .categories a');
  if (categoryLinks.length === 0) return;

  var categoryUrl = categoryLinks[0].href;
  var currentPath = location.pathname;

  // --- セッション内キャッシュ（記事を回遊しても再取得しない）---
  function cacheGet(key) {
    try { var v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function cacheSet(key, val) {
    try { sessionStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // カテゴリ一覧（タイトル＋URL）を取得。1カテゴリにつき1回だけ取りに行く。
  function getEntries() {
    var ck = 'reco:entries:' + categoryUrl;
    var cached = cacheGet(ck);
    if (cached) return Promise.resolve(cached);
    return fetch(categoryUrl)
      .then(function(response) { return response.text(); })
      .then(function(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var entries = Array.from(doc.querySelectorAll('.archive-entry')).map(function(entry) {
          var link = entry.querySelector('a.entry-title-link, .entry-title a, h1 a');
          return link ? { title: link.textContent.trim(), href: link.href } : null;
        }).filter(Boolean);
        cacheSet(ck, entries);
        return entries;
      });
  }

  // 記事のog:imageを取得。URL単位でキャッシュ → 同じ記事は二度取りに行かない。
  function getOgImage(url) {
    var ck = 'reco:ogimg:' + url;
    var cached = cacheGet(ck);
    if (cached !== null) return Promise.resolve(cached);
    return fetch(url)
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var match = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/);
        var img = match ? match[1] : '';
        cacheSet(ck, img);
        return img;
      })
      .catch(function() { return ''; });
  }

  // --- 1) 先に枠（スケルトン）を入れてスペースを確保する（CLS対策）---
  // 既存の .recommended-card / .recommended-thumb のCSSが大きさを決めるので、
  // 後からデータを流し込んでもレイアウトがズレない。失敗時は枠ごと撤去する。
  var comments = document.querySelector('.comment-box');
  var entryFooter = document.querySelector('.entry-footer');

  var section = document.createElement('div');
  section.className = 'recommended-articles';
  section.style.visibility = 'hidden';  // 埋まるまで非表示（場所だけ確保される）
  var skeleton = '<h3 class="recommended-title"><i class="fa-solid fa-star"></i> あなたへのおすすめ</h3><div class="recommended-grid">';
  for (var s = 0; s < 4; s++) {
    skeleton += '<a class="recommended-card" href="#" tabindex="-1"><div class="recommended-thumb"></div><div class="recommended-text"></div></a>';
  }
  skeleton += '</div>';
  section.innerHTML = skeleton;

  if (comments && comments.parentNode) {
    comments.parentNode.insertBefore(section, comments);
  } else if (entryFooter && entryFooter.parentNode) {
    entryFooter.parentNode.insertBefore(section, entryFooter.nextSibling);
  } else {
    return;
  }

  function removeSection() {
    if (section && section.parentNode) section.parentNode.removeChild(section);
  }

  // --- 2) 確保した枠にデータを流し込む ---
  function fill() {
    getEntries()
      .then(function(entries) {
        entries = entries.filter(function(entry) {
          return entry.href.indexOf(currentPath) === -1;
        });
        if (entries.length === 0) { removeSection(); return; }

        var picked = entries.slice().sort(function() { return 0.5 - Math.random(); }).slice(0, 4);

        return Promise.all(picked.map(function(article) {
          return getOgImage(article.href).then(function(img) {
            return { title: article.title, href: article.href, image: img };
          });
        })).then(function(list) {
          var cards = section.querySelectorAll('.recommended-card');
          list.forEach(function(article, idx) {
            var card = cards[idx];
            if (!card) return;
            card.setAttribute('href', article.href);
            card.removeAttribute('tabindex');
            var thumb = card.querySelector('.recommended-thumb');
            if (thumb && article.image) thumb.style.backgroundImage = 'url(' + article.image + ')';
            var text = card.querySelector('.recommended-text');
            if (text) text.textContent = article.title;
          });
          // 取得数が4未満なら余った枠を撤去
          for (var k = list.length; k < cards.length; k++) {
            if (cards[k] && cards[k].parentNode) cards[k].parentNode.removeChild(cards[k]);
          }
          section.style.visibility = '';  // 表示
        });
      })
      .catch(function(error) {
        console.error('おすすめ記事の読み込みに失敗:', error);
        removeSection();
      });
  }

  // 重い取得・解析は初期描画を邪魔しないようアイドル時に回す（LCP/INP対策）
  if ('requestIdleCallback' in window) {
    requestIdleCallback(fill, { timeout: 3000 });
  } else {
    setTimeout(fill, 1200);
  }
});
</script>
