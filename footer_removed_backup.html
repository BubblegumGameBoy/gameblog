<!-- ▼【削除6】あなたへのおすすめ（og:image版）＝記事を開くたびに計5ページをfetchする最重量スクリプト。最有力容疑。 -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  if (!document.body.classList.contains('page-entry')) return;

  var categoryLinks = document.querySelectorAll('.entry-categories a, .categories a');
  if (categoryLinks.length === 0) return;

  var categoryUrl = categoryLinks[0].href;
  var currentPath = location.pathname;

  fetch(categoryUrl)
    .then(function(response) { return response.text(); })
    .then(function(html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var entries = Array.from(doc.querySelectorAll('.archive-entry'));

      entries = entries.filter(function(entry) {
        var link = entry.querySelector('a.entry-title-link, .entry-title a, h1 a');
        return link && !link.getAttribute('href').includes(currentPath);
      });

      if (entries.length === 0) return;

      var shuffled = entries.sort(function() { return 0.5 - Math.random(); });
      var picked = shuffled.slice(0, 4);

      var articles = picked.map(function(entry) {
        var link = entry.querySelector('a.entry-title-link, .entry-title a, h1 a');
        return {
          title: link ? link.textContent.trim() : '',
          href: link ? link.href : '#'
        };
      });

      Promise.all(articles.map(function(article) {
        return fetch(article.href)
          .then(function(r) { return r.text(); })
          .then(function(html) {
            var match = html.match(/<meta\s+property=["']og:image["']\s+content=["']([^"']+)["']/);
            article.image = match ? match[1] : '';
            return article;
          })
          .catch(function() {
            article.image = '';
            return article;
          });
      })).then(function(articlesWithImages) {
        var section = document.createElement('div');
        section.className = 'recommended-articles';
        var html2 = '<h3 class="recommended-title"><i class="fa-solid fa-star"></i> あなたへのおすすめ</h3><div class="recommended-grid">';

        articlesWithImages.forEach(function(article) {
          html2 += '<a class="recommended-card" href="' + article.href + '">';
          html2 += '<div class="recommended-thumb"' + (article.image ? ' style="background-image:url(' + article.image + ')"' : '') + '></div>';
          html2 += '<div class="recommended-text">' + article.title + '</div></a>';
        });

        html2 += '</div>';
        section.innerHTML = html2;

        var comments = document.querySelector('.comment-box');
        var entryFooter = document.querySelector('.entry-footer');
        if (comments && comments.parentNode) {
          comments.parentNode.insertBefore(section, comments);
        } else if (entryFooter && entryFooter.parentNode) {
          entryFooter.parentNode.insertBefore(section, entryFooter.nextSibling);
        }
      });
    })
    .catch(function(error) {
      console.error('おすすめ記事の読み込みに失敗:', error);
    });
});
</script>
